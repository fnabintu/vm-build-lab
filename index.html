<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VM Build Lab</title>
<meta name="description" content="A free, beginner-friendly interactive lab for learning how virtual machines work and building your own Kali Linux VM on Windows, Mac, or Linux.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a lab notebook — sticky step rail on the left, one hands-on station at a time on the right; terminal panels are the signature element */
:root{
  --bg:#FBF9FD; --surface:#FFFFFF; --soft:#F1EAF7; --ink:#1D1630; --muted:#5F5675; --line:#DDD4E8;
  --accent:#6A2C91; --accent-ink:#FFFFFF; --green:#4F7F17; --green-soft:#EAF4DC;
  --warn:#B4530A; --warn-soft:#FCEBDC; --term:#2A2240; --term-ink:#F3EFFA; --term-dim:#B9B0D3; --prompt:#9FD45A; color-scheme:light;
  --f-display:'Bricolage Grotesque', 'Segoe UI', sans-serif;
  --f-body:'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
:root[data-theme="dark"]{
  --bg:#15111F; --surface:#1E192C; --soft:#2A2340; --ink:#EEE9F7; --muted:#B0A7C7; --line:#3A3252;
  --accent:#C29BE6; --accent-ink:#1A1028; --green:#A3D867; --green-soft:#1F2A17;
  --warn:#F4A866; --warn-soft:#382416; --term:#0E0B17; --term-ink:#ECE7F7; --term-dim:#9890B6; --prompt:#A3D867; color-scheme:dark}
.theme{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.theme button{font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:6px 14px;background:transparent;color:var(--muted)}
.theme button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.theme button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header img{width:72px;height:78px;object-fit:contain;border-radius:50%;background:#fff}
header .t{flex:1;min-width:220px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.meter{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;min-width:180px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:4px}
nav .grp{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;font-size:15px}
nav button:hover{background:var(--surface)}
nav button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:700}
nav button:focus-visible{outline:2px solid var(--accent)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;font-family:var(--f-mono)}
.done .dot{background:var(--green);border-color:var(--green);color:var(--surface)}
main{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0}
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
p{margin:0;max-width:66ch}
.lead{font-size:19px}
.task{border:1px dashed var(--accent);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.task>b{font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{font:inherit;font-size:15px;cursor:pointer;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-align:left}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.btn{font:inherit;font-weight:700;cursor:pointer;padding:11px 18px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.fb{padding:12px 14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--green-soft);color:var(--ink);border-left:4px solid var(--green)}
.fb.no{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.term{background:var(--term);color:var(--term-ink);border-radius:12px;font-family:var(--f-mono);font-size:14px;overflow:hidden}
.term .tb{display:flex;gap:7px;align-items:center;padding:10px 14px;background:rgba(255,255,255,.06);color:var(--term-dim);font-size:12px}
.term .tb s{width:11px;height:11px;border-radius:50%;text-decoration:none;display:inline-block}
.term .out{padding:14px 16px;min-height:120px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.term .in{display:flex;gap:8px;align-items:center;padding:0 16px 14px}
.term .in span{color:var(--prompt)}
.term input{flex:1;min-width:0;background:transparent;border:0;color:var(--term-ink);font:inherit;caret-color:var(--prompt)}
.p{color:var(--prompt)} .d{color:var(--term-dim)} .r{color:#F59E9E}
.stack{display:flex;flex-direction:column;gap:8px}
.layer{all:unset;cursor:pointer;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border:2px solid transparent}
.layer:focus-visible{outline:2px solid var(--accent)}
.layer small{font-family:var(--f-mono);font-size:12px;opacity:.8}
.layer.on{border-color:var(--green)}
.guests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.l-g{background:var(--bg);border:2px solid var(--accent)} .l-h{background:var(--accent);color:var(--accent-ink)}
.l-o{background:var(--soft);color:var(--ink);border-color:var(--line)} .l-hw{background:var(--line);color:var(--ink)}
.l-g.on,.l-h.on,.l-o.on,.l-hw.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.explain{background:var(--bg);border-radius:10px;padding:14px 16px;min-height:76px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
label{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
select{font:inherit;padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.ram{display:flex;height:34px;border-radius:8px;overflow:hidden;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.ram div{display:grid;place-items:center;transition:flex .3s;white-space:nowrap;overflow:hidden}
.ram .vm{background:var(--accent);color:var(--accent-ink)} .ram .host{background:var(--line);color:var(--ink)}
.files{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:15px}
.files .opt{font-family:var(--f-mono);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.files small{color:var(--muted)}
.files .opt span{word-break:break-all;min-width:0}
.hash{font-family:var(--f-mono);font-size:13px;word-break:break-all;background:var(--bg);padding:8px 10px;border-radius:8px}
.tl{display:flex;flex-direction:column;gap:0;font-family:var(--f-mono);font-size:14px}
.tl div{padding:8px 0 8px 18px;border-left:2px solid var(--line);position:relative}
.tl div::before{content:"";position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.tl div.snap::before{background:var(--green)} .tl div.cur{font-weight:700}
.vmscreen{border-radius:12px;padding:20px;font-family:var(--f-mono);font-size:14px;min-height:120px;display:flex;flex-direction:column;gap:6px;justify-content:center;transition:background .3s}
.vmscreen.ok{background:var(--term);color:var(--term-ink)} .vmscreen.bad{background:#5B1220;color:#FFD9DE}
.badge{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--soft);color:var(--ink);border-radius:14px;padding:22px}
.badge img{width:90px;height:97px;background:#fff;border-radius:50%;object-fit:contain}
.badge a{color:var(--accent)}
.badge div{min-width:0;flex:1}
a{color:var(--accent)}
.osbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.osbar>span{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.osbar .opt{padding:8px 12px;font-size:14px}
.osbar .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.how{border-radius:12px;background:var(--bg);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.how h3 span{font-family:var(--f-mono);font-size:13px;font-weight:400;color:var(--muted)}
.how ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:66ch}
.remember{border-radius:12px;padding:16px 18px;background:var(--green-soft);color:var(--ink);border-left:5px solid var(--green);display:flex;gap:14px;align-items:flex-start}
.remember b{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);flex:none;padding-top:3px}
.remember p{font-size:18px}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.words div{background:var(--bg);border-radius:10px;padding:12px 14px}
.words dt{font-weight:700}.words dd{margin:2px 0 0;color:var(--muted);font-size:15px}
.cheat{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cheat div{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.cheat div:first-child{border-top:0}
.cheat dt{font-weight:700}.cheat dd{margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--bg);padding:1px 6px;border-radius:5px;word-break:break-word}
.term code{background:rgba(255,255,255,.1)}
@media (max-width:560px){.cheat div{grid-template-columns:1fr;gap:2px}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs button.ok::after{content:" ✓";color:var(--green)}
.tabs button.ok[aria-selected="true"]::after{color:var(--accent-ink)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.plain{background:var(--soft);border-radius:10px;padding:14px 16px}
.tech{border:1.5px solid var(--line);border-radius:10px;padding:14px 16px}
.plain b.k,.tech b.k{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.dg{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px}
.dg .bx{flex:1;min-width:120px;border-radius:10px;padding:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.dg .bx.a{background:var(--soft);border-color:var(--accent)}
.dg .bx.g{background:var(--green-soft);border-color:var(--green)}
.dg .bx.w{background:var(--warn-soft);border-color:var(--warn)}
.dg .ar{align-self:center;color:var(--muted);font-size:18px}
.dg .bx small{color:var(--muted);font-family:var(--f-body);font-size:13px}
.ins{display:flex;flex-wrap:wrap;gap:8px}
.disk{height:30px;border-radius:8px;background:var(--line);display:flex;overflow:hidden;font-family:var(--f-mono);font-size:12px}
.disk div{display:grid;place-items:center;white-space:nowrap;overflow:hidden;transition:flex .3s}
@media (max-width:820px){.grid{grid-template-columns:1fr} nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px} nav .grp{display:none} nav button{white-space:nowrap;border:1px solid var(--line)} .guests{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function rS2(s){
  const o=cur();if(!o){$('#main').innerHTML=shell(s,`<h2>Download and check Kali</h2>${pickFirst()}`);return}
  const K=o.kali,cmd=o.hashCmd(K.file),real=K.sha;
  const tampered=Math.random()<.5, got=tampered?real.slice(0,20)+(real[20]==='d'?'e':'d')+real.slice(21):real;
  const out=cmd.startsWith('certutil')?`SHA256 hash of ${K.file}:\n${got}\nCertUtil: -hashfile command completed successfully.\n`:`${got}  ${K.file}\n`;
  $('#main').innerHTML=shell(s,`<h2>Download Kali, then check it</h2>
  <p class="lead">A <b>hash</b> is a file's fingerprint: a long code calculated from every bit of the file. If even one bit changes, the fingerprint changes completely. Comparing yours to the official one proves the download wasn't damaged or tampered with.</p>
  ${how('Download '+K.name,['Pick one link. Link 1 is usually fastest. Use another if it is slow or fails: '+kaliLinks(o)+'.','On Google Drive, if it says the file is too large to scan for viruses, click <b>Download anyway</b>.','The file is large, so give it time. It saves as <code>'+K.file+'</code>.'])}
  <div class="hash"><b>Official SHA256 from zSecurity for ${K.name}:</b><br>${real}</div>
  ${how('Check your file\'s hash',o.hashHow)}
  <div class="task"><b>Practice</b><p>Type <code>${esc(cmd)}</code> and press Enter. Try the shortcut: type <code>${esc(cmd.split(' Kali')[0])} Kali</code>, then press <code>Tab</code>.</p>
  ${termBox(o.term,esc(o.prompt))}<div id="judge"></div></div>`);
  const ob=$('#o'),ti=$('#ti');
  ti.onkeydown=e=>{
    if(e.key==='Tab'){const m=ti.value.match(/(\S+)$/);if(m&&K.file.toLowerCase().startsWith(m[1].toLowerCase())&&m[1].length>0){e.preventDefault();ti.value=ti.value.slice(0,-m[1].length)+K.file+(cmd.endsWith('SHA256')?' ':'')}else e.preventDefault();return}
    if(e.key!=='Enter')return;const v=ti.value.trim();ti.value='';
    ob.innerHTML+=`<span class="p">${esc(o.prompt)}</span> ${esc(v)}\n`;
    if(v.replace(/\s+/g,' ').toLowerCase()===cmd.toLowerCase()){
      ob.innerHTML+=out;
      $('#judge').innerHTML=`<p>Compare the result with the official hash above. Do they match exactly?</p><div class="opts"><button class="opt" data-a="1">They match</button><button class="opt" data-a="0">They don't match</button></div><div class="res"></div>`;
      document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const right=(b.dataset.a==='1')!==tampered;
        document.querySelectorAll('[data-a]').forEach(x=>x.classList.remove('wrong'));b.classList.add(right?'right':'wrong');
        fb($('#judge .res'),right,right?(tampered?'Good catch: the 21st character is different. Delete the file and download it again from another link.':'Correct, every character matches. The file is safe to unzip.'):(tampered?'Look closely at the 21st character. One difference means the file is not the official one.':'Look again: they match exactly. A mismatch would mean deleting and re-downloading.'));
        if(right)complete('s2')});
    }else ob.innerHTML+=`<span class="r">Not quite. Type exactly: ${esc(cmd)}</span>\n`;
    ob.scrollTop=ob.scrollHeight;};
}

function rS5(s){
  $('#main').innerHTML=shell(s,`<h2>Log in, then change the password</h2>
  <p class="lead">This Kali VM comes with username <code>root</code> and password <code>toor</code> ("root" backwards). Everyone who downloads it knows that, so changing it comes first. Default passwords are one of the most common ways real systems get hacked.</p>
  <div class="how"><h3>Words to know</h3><ol><li><b>Terminal:</b> a window where you type commands instead of clicking.</li><li><b>root:</b> the all-powerful admin account on Linux.</li><li><b>passwd:</b> the command that changes your password. When you type a password in Linux, nothing appears on screen. That's normal.</li></ol></div>
  <div class="task"><b>Practice</b><p>Type <code>passwd</code> and press Enter. Type a new password twice. Then type <code>apt update</code> to refresh Kali's app list.</p>
  ${termBox('root@kali: ~','root@kali:~#')}<div id="r5"></div></div>`);
  const ob=$('#o'),ti=$('#ti'),ps=$('#ps');let mode='sh',first='',pwOk=false;
  const pr=t=>{ob.innerHTML+=t;ob.scrollTop=ob.scrollHeight};
  const reset=()=>{mode='sh';ti.type='text';ps.textContent='root@kali:~#'};
  ti.onkeydown=e=>{if(e.key!=='Enter')return;const v=ti.value;ti.value='';
    if(mode==='sh'){pr(`<span class="p">root@kali:~#</span> ${esc(v)}\n`);const c=v.trim().toLowerCase();
      if(c==='passwd'){mode='p1';ti.type='password';ps.textContent='New password:'}
      else if(c==='apt update'){if(!pwOk)pr('<span class="r">Change the password first. Type passwd.</span>\n');
        else{pr('Hit:1 http://http.kali.org/kali kali-rolling InRelease\nReading package lists... Done\n<span class="p">All packages are up to date.</span>\n');fb($('#r5'),true,'Done! Your VM is secured and up to date.');complete('s5')}}
      else if(c)pr(`<span class="r">Try: ${pwOk?'apt update':'passwd'}</span>\n`);}
    else if(mode==='p1'){pr('New password: \n');
      if(v==='toor'){pr('<span class="r">That\'s the old default. Pick something new.</span>\n');reset()}
      else if(v.length<8){pr('<span class="r">BAD PASSWORD: it is shorter than 8 characters</span>\n');reset()}
      else{first=v;mode='p2';ps.textContent='Retype new password:'}}
    else{pr('Retype new password: \n');
      if(v===first){pr('passwd: password updated successfully\n');pwOk=true;fb($('#r5'),true,'Password changed. Now type <code>apt update</code>.')}
      else pr('<span class="r">Sorry, passwords do not match. Type passwd to try again.</span>\n');reset()}};
}

const INS_OK={};
const INSIDE=[
{k:'cpu',t:'CPU',
 plain:'Most of what your VM does runs directly on your real processor at full speed. Only "sensitive" requests, like touching hardware, get paused and handled by the hypervisor.',
 tech:'Modern processors have built-in virtualization support: <b>Intel VT-x</b>, <b>AMD-V</b>, or Apple\'s virtualization extensions. The guest runs in a restricted CPU mode. Ordinary instructions run natively. Privileged ones (changing the memory map, talking to devices, halting the CPU) cause a <b>VM exit</b>: the processor hands control to the hypervisor, which performs the action safely and then resumes the guest. This is called <b>trap-and-emulate</b>. Because the guest runs on the real processor, its instructions must match the processor\'s architecture: x86 guests on Intel/AMD, ARM64 guests on Apple Silicon.',
 demo:()=>`<p><b>Try it:</b> send an instruction from Kali and see where it goes.</p>
  <div class="ins">${INSTR.map((x,i)=>`<button class="opt" data-in="${i}">${x[0]}</button>`).join('')}</div><div id="cpuout"></div>`,
 wire:()=>document.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>{const x=INSTR[+b.dataset.in];
  $('#cpuout').innerHTML=x[1]?`<div class="dg"><div class="bx a">Kali<small>${x[0]}</small></div><span class="ar">→</span><div class="bx g">Real CPU<small>runs it directly at full speed</small></div></div>`
  :`<div class="dg"><div class="bx a">Kali<small>${x[0]}</small></div><span class="ar">→</span><div class="bx w">VM exit<small>CPU pauses the guest</small></div><span class="ar">→</span><div class="bx">Hypervisor<small>${x[2]}</small></div><span class="ar">→</span><div class="bx a">Back to Kali<small>guest resumes</small></div></div>`}),
 q:'Why can\'t an Apple Silicon Mac run the regular 64-bit Kali VM?',
 o:[{t:'It doesn\'t have enough RAM',ok:false,why:'RAM isn\'t the issue. Think about where the VM\'s instructions actually run.'},
    {t:'The VM runs on the real CPU, so its instructions must be ARM, not x86',ok:true,why:'Exactly. Virtualization runs guest code on the real processor. Running a different architecture needs full emulation, which is far slower.'},
    {t:'Apple blocks Linux',ok:false,why:'Linux runs fine on Apple Silicon, as long as it\'s the ARM64 build.'}]},
{k:'mem',t:'Memory',
 plain:'Kali thinks it owns a neat block of memory starting at zero. Really, the hypervisor has scattered Kali\'s memory across your real RAM and keeps a map of where each piece lives.',
 tech:'There are three kinds of addresses. The guest\'s page tables turn a <b>guest virtual</b> address into a <b>guest physical</b> one. The hypervisor then maps guest physical to <b>host physical</b> RAM. The processor does that second step in hardware using <b>Second Level Address Translation</b> (Intel <b>EPT</b>, AMD <b>NPT</b>). A VM can only reach host memory that appears in its map, which is the foundation of isolation between VMs.',
 demo:()=>`<div class="dg"><div class="bx a">Guest virtual<small>what a Kali app uses</small></div><span class="ar">→</span><div class="bx a">Guest physical<small>Kali's page tables</small></div><span class="ar">→</span><div class="bx g">Host physical<small>EPT / NPT, set up by the hypervisor</small></div></div>`,
 q:'Kali reads memory address 0x1000. Where is that data in your real RAM?',
 o:[{t:'At address 0x1000',ok:false,why:'Kali\'s "physical" addresses are an illusion. They get translated again.'},
    {t:'Wherever the hypervisor\'s map points',ok:true,why:'Right. The hypervisor\'s second-level map decides the real location, and Kali can\'t see or change it.'},
    {t:'On the hard drive',ok:false,why:'Memory stays in RAM. It just lives at a different real address than Kali thinks.'}]},
{k:'disk',t:'Storage',
 plain:'Your VM\'s whole hard drive is one big file on your real computer, the <code>.vmdk</code>. Copy that folder, and you\'ve copied the entire computer.',
 tech:'The hypervisor shows Kali a virtual disk controller (SATA, SCSI, or NVMe). When Kali writes to "sector 5000," VMware writes to the matching spot inside the <code>.vmdk</code> file. Disks are usually <b>thin-provisioned</b>: an 80 GB virtual disk only uses as much real space as has been written, and grows over time. A <b>snapshot</b> freezes the disk file and sends new writes to a small <b>delta file</b>. Reverting deletes the delta.',
 demo:()=>`<label for="dw">Data written inside Kali <span id="dwv"></span></label><input type="range" id="dw" min="5" max="80" value="20">
  <div class="disk" aria-hidden="true"><div id="dused" style="background:var(--accent);color:var(--accent-ink)"></div><div id="dfree" style="color:var(--ink)"></div></div>

  $('#dtxt').textContent=`Kali sees an 80 GB drive. On your real computer, the .vmdk file takes about ${v} GB.`};$('#dw').oninput=u;u()},

{k:'dev',t:'Devices',
 plain:'The screen, keyboard, mouse, and USB are pretend devices too. Extra drivers called <b>VMware Tools</b> make them faster and add conveniences like copy-paste between your computer and the VM.',
 tech:'<b>Emulated</b> devices imitate real, older hardware so any operating system can use them, but every access causes VM exits, which is slow. <b>Paravirtual</b> devices (like VMXNET3 networking) are built for VMs: the guest knows it\'s virtual and trades data with the hypervisor through shared memory. On Linux, VMware Tools is the <code>open-vm-tools</code> package. It adds those drivers plus clipboard sharing, auto screen resizing, and time sync.<br><br><b>Why it matters for security:</b> every virtual device is code the VM can talk to. A bug in it can allow a <b>VM escape</b>, where malware breaks out of the VM into your real computer. It\'s rare but real, so keep VMware updated.',
 demo:()=>`<div class="dg"><div class="bx w">Emulated<small>pretends to be real hardware · works everywhere · slower</small></div><div class="bx g">Paravirtual<small>made for VMs · needs VMware Tools · faster</small></div></div>`,
 q:'Copy-paste between your computer and Kali doesn\'t work. What\'s the most likely fix?',
 o:[{t:'Give the VM more RAM',ok:false,why:'Memory doesn\'t control the shared clipboard.'},
    {t:'Install open-vm-tools-desktop in Kali and restart',ok:true,why:'Yes. Run <code>sudo apt install open-vm-tools-desktop</code>, then reboot the VM. Those tools provide the shared clipboard.'},
    {t:'Switch the network to Bridged',ok:false,why:'Copy-paste goes through VMware Tools, not the network.'}]}
];
const INSTR=[['Add two numbers',1],['Write to its own memory',1],['Read from the disk',0,'turns it into a read of the .vmdk file'],['Change the memory map',0,'checks it and updates the real map'],['Turn off interrupts',0,'records it for this VM only']];
let insTab=0;
function rInside(s){
  if(st.done.inside)INSIDE.forEach(y=>INS_OK[y.k]=true);
  $('#main').innerHTML=shell(s,`<h2>How a VM works inside</h2>
  <p class="lead">The hypervisor's job is to <b>share one real computer</b> among several pretend ones without letting them see or touch each other. Here is how it handles each part. Read the plain version first, then the technical one.</p>
  <div class="tabs" role="tablist">${INSIDE.map((x,i)=>`<button role="tab" data-t="${i}" aria-selected="${i===insTab}" class="${INS_OK[x.k]?'ok':''}">${x.t}</button>`).join('')}</div>
  <div id="tabbody" style="display:flex;flex-direction:column;gap:16px"></div>`);
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{insTab=+b.dataset.t;rInside(s)});
  const x=INSIDE[insTab];
  $('#tabbody').innerHTML=`<div class="two"><div class="plain"><b class="k">In plain words</b><p>${x.plain}</p></div><div class="tech"><b class="k">The technical version</b><p>${x.tech}</p></div></div>
   <div class="how">${x.demo()}</div>
   <div class="task"><b>Check yourself · ${INSIDE.filter(y=>INS_OK[y.k]).length} of 5 done</b><p>${x.q}</p>${optsHTML(x.o)}</div>`;
  if(x.wire)x.wire();
  quiz($('#tabbody .task'),x.o,()=>{INS_OK[x.k]=true;const tb=document.querySelector(`[data-t="${insTab}"]`);tb.classList.add('ok');
    if(INSIDE.every(y=>INS_OK[y.k]))complete('inside');
    else{const nx=INSIDE.findIndex(y=>!INS_OK[y.k]);$('#tabbody .res').insertAdjacentHTML('beforeend',`<button class="btn ghost" style="margin-top:10px" onclick="insTab=${nx};rInside(S[${S.indexOf(s)}])">Next: ${INSIDE[nx].t}</button>`)}});
}

render();
</script>

</body>
</html>
